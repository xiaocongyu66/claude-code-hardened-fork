name: Ink Rust core

on:
  push:
    branches: [feat/ink-rust]
    paths:
      - 'packages/ink-rust/native/**'
      - '.github/workflows/ink-rust.yml'
  pull_request:
    paths:
      - 'packages/ink-rust/native/**'
      - '.github/workflows/ink-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ink-rust/native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # 版本依据：本仓库成功 CI run 41384740282 的 rustc 日志；固定 SHA 不等于固定 stable 版本。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Record toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Deterministic scene example
        run: |
          cargo run --quiet --locked -p ink-rust-core --example scene > "$RUNNER_TEMP/ink-rust-scene.actual"
          diff -u core/examples/scene.expected "$RUNNER_TEMP/ink-rust-scene.actual"
