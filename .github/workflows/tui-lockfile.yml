name: TUI lockfile

# Regenerates bun.lock after enabling the prebuilt TUI platform packages.
#
# CI enforces `bun install --frozen-lockfile`, so the root manifest and the
# lockfile must change together. Run this workflow, download the artifact, and
# commit the updated `package.json` + `bun.lock`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to prepare
        required: true
        default: feat/tui-rewrite

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Enable TUI platform packages
        run: node scripts/enable-tui-packages.mjs

      - name: Regenerate the lockfile
        run: bun install --lockfile-only

      - name: Show the manifest diff
        run: git --no-pager diff -- package.json bun.lock

      - name: Upload the lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75dcf2f7b8caf0bdbdb0d3b8b0f # v4
        with:
          name: tui-lockfile
          path: |
            bun.lock
            package.json
