name: TUI release

# One-click release for the six prebuilt TUI platform packages plus the root
# package. Rust is NOT rebuilt here: the `native-<triple>` artifacts are pulled
# from a CI run, assembled into packages/tui-native/platforms/*, packed,
# verified and — unless `dry_run` is true — published platform-first, root-last.
run-name: "TUI release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, optionally prefixed with v)"
        required: true
        type: string
      dry_run:
        description: "Pack and verify only; do not publish to npm"
        required: true
        type: boolean
        default: true
      source_run_id:
        description: "CI run ID that produced the native-<triple> artifacts (empty = latest completed ci.yml run on this ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: tui-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - name: Resolve the CI run with native artifacts
        id: native_run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          run_id="$SOURCE_RUN_ID"
          if [ -z "$run_id" ]; then
            run_json=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" \
              --status completed --limit 1 \
              --json databaseId,headSha,conclusion,url)
            run_id=$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')
            printf '%s' "$run_json" | jq -r '.[0] | "using CI run \(.databaseId) @ \(.headSha) (\(.conclusion)) — \(.url)"'
          else
            gh run view "$run_id" --json headSha,conclusion,url,workflowName
          fi
          if [ -z "$run_id" ]; then
            echo "::error::no completed ci.yml run found for $GITHUB_REF_NAME; pass source_run_id"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.native_run.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" --pattern 'native-*' --dir artifacts

      - name: Verify the native artifact matrix
        run: |
          set -euo pipefail
          TRIPLES="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc"
          for triple in $TRIPLES; do
            case "$triple" in
              *-windows-msvc) bin=cch-tui.exe ;;
              *) bin=cch-tui ;;
            esac
            base="artifacts/native-$triple/tui/$triple"
            for file in "$base/$bin" "$base/$bin.sha256"; do
              if [ ! -f "$file" ]; then
                echo "::error::missing native artifact: $file"
                exit 1
              fi
            done
          done
          find artifacts -path '*tui*' -type f | LC_ALL=C sort

      - name: Populate vendor/ for the root bundle
        run: |
          set -euo pipefail
          for dir in artifacts/native-*; do
            triple="${dir#artifacts/native-}"
            for name in token-counter transcript-parser color-diff file-index search; do
              src="$dir/$name/$triple/$name.node"
              if [ ! -f "$src" ]; then
                echo "::error::missing native addon: $src"
                exit 1
              fi
              mkdir -p "vendor/$name/$triple"
              cp "$src" "vendor/$name/$triple/"
            done
          done
          find vendor -name '*.node' | LC_ALL=C sort

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6, 2026-04-25
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Must run after the frozen-lockfile install (it rewrites the root
      # optionalDependencies, which the lockfile check would reject) and before
      # the build (dist embeds the version read from package.json).
      - name: Assemble platform packages
        run: |
          node scripts/assemble-tui-packages.mjs \
            --stage artifacts \
            --version "$RELEASE_VERSION" \
            --sync-root-manifest

      # Same build as the root package's prepublishOnly hook. npm pack does not
      # run prepublishOnly, so build explicitly before packing the root tarball.
      - name: Build root dist
        run: bun run build:vite

      - name: Pack platform packages and the root package
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p release
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm pack --pack-destination release "packages/tui-native/platforms/$pkg"
          done
          # dist/ was built above; skip husky (prepare) and any future prepack hooks.
          npm pack --ignore-scripts --pack-destination release .
          ls -l release

      - name: Verify tarballs
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          check_platform() {
            key="$1"
            case "$key" in
              windows-*) bin=cch-tui.exe ;;
              *) bin=cch-tui ;;
            esac
            tgz="release/cch-tui-${key}-${version}.tgz"
            [ -f "$tgz" ] || { echo "::error::missing $tgz"; exit 1; }

            printf 'package/bin/%s\npackage/bin/%s.sha256\npackage/package.json\n' \
              "$bin" "$bin" > "$work/expected-$key.txt"
            tar -tzf "$tgz" | grep -v '/$' | LC_ALL=C sort -u > "$work/actual-$key.txt"
            if ! diff -u "$work/expected-$key.txt" "$work/actual-$key.txt"; then
              echo "::error::$tgz must contain only package.json + bin/*"
              exit 1
            fi

            mkdir -p "$work/x-$key"
            tar -xzf "$tgz" -C "$work/x-$key"
            [ -x "$work/x-$key/package/bin/$bin" ] || {
              echo "::error::$tgz: $bin is not executable"
              exit 1
            }
            (cd "$work/x-$key/package/bin" && sha256sum -c "$bin.sha256")
            node -e '
              const fs = require("node:fs")
              const [file, key, version] = process.argv.slice(1)
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
              if (pkg.name !== `@cch/tui-${key}`) throw new Error(`name ${pkg.name}`)
              if (pkg.version !== version) throw new Error(`version ${pkg.version}`)
              if (!Array.isArray(pkg.files) || pkg.files.join() !== "bin/") {
                throw new Error(`files ${JSON.stringify(pkg.files)}`)
              }
            ' "$work/x-$key/package/package.json" "$key" "$version"
          }

          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            check_platform "$key"
          done

          root_tgz="release/claude-code-hardened-${version}.tgz"
          [ -f "$root_tgz" ] || { echo "::error::missing $root_tgz"; exit 1; }
          mkdir -p "$work/root"
          tar -xzf "$root_tgz" -C "$work/root"
          node -e '
            const fs = require("node:fs")
            const [file, version, entry] = process.argv.slice(1)
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
            if (pkg.name !== "claude-code-hardened") throw new Error(`name ${pkg.name}`)
            if (pkg.version !== version) throw new Error(`version ${pkg.version}`)
            for (const key of ["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "windows-x64", "windows-arm64"]) {
              const dep = pkg.optionalDependencies?.[`@cch/tui-${key}`]
              if (dep !== version) throw new Error(`@cch/tui-${key}: ${dep}`)
            }
            if (!fs.existsSync(entry)) throw new Error(`missing ${entry}`)
          ' "$work/root/package/package.json" "$version" "$work/root/package/dist/cli-node.js"
          echo "✓ all 6 platform tarballs and the root tarball verified"

      - name: Upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: tui-release-${{ inputs.version }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm publish "release/cch-tui-${key}-${version}.tgz" --access public
          done

      - name: Publish root package (last)
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          npm publish "release/claude-code-hardened-${version}.tgz" --access public

      - name: Summary
        run: |
          {
            echo "### TUI release ${RELEASE_VERSION}"
            echo ""
            echo "- Native CI run: ${{ steps.native_run.outputs.run_id }}"
            echo "- dry_run: ${{ inputs.dry_run }}"
            echo "- Artifact: \`tui-release-${RELEASE_VERSION}\` (7 tarballs)"
          } >> "$GITHUB_STEP_SUMMARY"
