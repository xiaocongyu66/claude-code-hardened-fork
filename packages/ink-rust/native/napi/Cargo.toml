[workspace]
resolver = "3"

[package]
name = "ink-rust-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
ink-rust-core = { path = "../core" }
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "compat-mode"] }
napi-derive = "=3.6.13"

# Test-only JSON data fixture; no wire interpreter or core dependency.
[dev-dependencies]
serde_json = "1"

[build-dependencies]
napi-build = "=2.6.0"
