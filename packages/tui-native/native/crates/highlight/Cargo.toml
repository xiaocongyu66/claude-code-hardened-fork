[package]
name = "cch-tui-highlight"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust regex backend (fancy-regex); `onig` is deliberately not enabled.
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
# Bat's extra syntax definitions (TypeScript/TSX and friends) on top of
# syntect's built-in set. Pure-Rust regex backend, like syntect above.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
